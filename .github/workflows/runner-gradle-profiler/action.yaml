name: 'GE Experiment Runner with Gradle Profiler'
description: 'Executes with Gradle Profiler a scenario defined'
inputs:
  task:
    description: ""
    required: true
  warmups:
    description: "Number of build warmups"
    required: false
    default: 1
  iterations:
    description: "Number of iterations"
    required: false
    default: 5
  class:
    description: "Class to apply the abi change"
    required: false
  variant:
    description: "variant of the experiment, represents the branch"
    required: true
  variant-prefix:
    required: true    
  experiment-id:
    description: ""
    required: true
  api-key:
    description: ""
    required: true
  repository:
    required: true
  jdk_version:
    required: false
    default: 17
  jdk_vendor:
    required: false
    default: "zulu"
  extra-args:
    required: true        
  cache-url:
    required: false    

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v4
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.variant }}
    - uses: actions/setup-java@v4
      with:
        distribution: ${{ inputs.jdk_vendor }}
        java-version: ${{ inputs.jdk_version }}
    - uses: sdkman/sdkman-action@master
      id: sdkman
      with:
        candidate: gradleprofiler
        version: 0.20.0
    - name: Execute Gradle build
      id : geapix
      run: |
           unzip  ${{ steps.sdkman.outputs.file }}
           EXTRA_ARG=""
           if [ -z "${{ inputs.extra-args }}" ]
             EXTRA_ARG="-Pfoo"
           else
             EXTRA_ARG="${{ inputs.extra-args }}"  

           if [ -z "${{ inputs.class }}" ]
           then
               echo $'assemble { \n title= "assemble" \n tasks = ["${{ inputs.task }}"] \n cleanup-tasks = ["clean"] \n gradle-args = [$EXTRA_ARG, "-Dscan.tag.${{ inputs.variant-prefix }}${{ inputs.variant }}", "-Dscan.tag.experiment", "-Dscan.tag.${{inputs.experiment-id}}"] \n}' > scenario
           else
               echo $'assemble { \n title= "assemble" \n tasks = ["${{ inputs.task }}"] \n cleanup-tasks = ["clean"] \n apply-abi-change-to = [${{ inputs.class }}] \n gradle-args = [$EXTRA_ARG,"-Dscan.tag.${{ inputs.variant-prefix }}${{ inputs.variant }}", "-Dscan.tag.experiment", "-Dscan.tag.${{inputs.experiment-id}}"] \n}' > scenario
           fi
           gradle-profiler-0.20.0/bin/gradle-profiler --benchmark --scenario-file scenario assemble --warmups ${{ inputs.warmups }} --iterations ${{ inputs.iterations }}
           TABLE_OUTPUT="<table><tr><td>Build</td><td></td></tr>"
           while read line
           do
            IN=$line
            set -- "$IN"
            IFS=","; declare -a Array=($*)
            TABLE_OUTPUT="$TABLE_OUTPUT<tr><td>${Array[0]}</td><td>${Array[1]}</td></tr>"
           done < <(tail -n +2 profile-out/benchmark.csv)
           echo "$TABLE_OUTPUT</table>" >> $GITHUB_STEP_SUMMARY


      shell: bash
      env:
        DEVELOCITY_ACCESS_KEY: ${{ inputs.api-key }}
        CI_URL_CACHE_NODE: ${{ inputs.cache-url }}        
    - name: Archive production artifacts
      uses: actions/upload-artifact@v4
      with:
        name: profiler-${{ inputs.variant-prefix }}${{inputs.variant}}
        path: |
          profile-out/*
