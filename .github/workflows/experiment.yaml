name: Experiment

on:
  workflow_dispatch:
    inputs:
      repository:
        required: true
        default: "cdsap/ExperimentGradle8.9"
      variantA:
        required: true
        default: "gradle_8_9_no_caching_transforms"
      variantB:
        required: true
        default: "gradle_8_9_no_caching_transforms"
      task:
        default: ":core:model:compileKotlin"
        required: true
      iterations:
        default: 10
        required: true
      mode:
        description: "Type of execution relative to caching"
        type: choice
        required: true
        default: 'dependencies cache'
        options:
          - 'no caching'
          - 'dependencies cache'
          - 'dependencies cache - trasnforms cache'
          - 'local task cache' 
          - 'local task cache + dependencies cache' 
          - 'local task cache - transforms cache' 
          - 'local task cache + dependencies cache - transforms cache' 
          - 'remote task cache' 
          - 'remote task cache + dependencies cache'
          - 'remote task cache - transforms cache' 
          - 'remote task cache + dependencies cache - transforms cache'
      java_args:
        description: JDK vendor and version
        type: string
        default: "{javaVersionVariantA:'17',javaVersionVariantB:'17',javaVendorVariantA:'zulu',javaVendorVariantB:'zulu'}"
        required: false          
      extra_build_args:
        description: Extra build arguments
        type: string
        default: "extraArgsVariantA:' ',extraArgsVariantB:' '}"
        required: false
      extra_report_args:
        description: Report configuration
        type: string
        default: "{report_enabled:'true',taskpath_report:'true',kotlin_build_report:'true',process_report:'true'}"
        required: false



run-name: "${{ github.event.inputs.repository }}-${{ github.event.inputs.mode }}-${{ github.event.inputs.variantA }}-${{ github.event.inputs.variantB }}-${{ github.event.inputs.task }}"

jobs:
  iterations:
    name: Generate versions
    runs-on: ubuntu-latest
    steps:
      - id: calculate_iterations
        run: |
          iterations="["
          for i in {1..${{ github.event.inputs.iterations }}}
          do
            if [ $i == 1 ]
            then
              iterations="$iterations \"$i\""
            else
              iterations="$iterations  , \"$i\""
            fi
          done
          iterations="$iterations ]"
          echo "iterations=$iterations" >> $GITHUB_OUTPUT
          echo $GITHUB_OUTPUT
    outputs:
      iterations: ${{ steps.calculate_iterations.outputs.iterations }}

  seed:
    if: github.event.inputs.mode != 'no caching'
    needs: [iterations]
    strategy:
      matrix:
        variant: ["${{ github.event.inputs.variantA }}","${{ github.event.inputs.variantB }}"]
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/runner-seed
        with:
          task: "${{ github.event.inputs.task }}"
          mode: "${{ github.event.inputs.mode }}"
          experiment-id: "${{github.run_number}}"
          variant: ${{ matrix.variant }}
          run-id: 1
          api-key: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
          repository: ${{ github.event.inputs.repository }}
          variant-prefix: ${{ (matrix.variant == github.event.inputs.variantA) &&  'varianta_' || (matrix.variant == github.event.inputs.variantB) &&  'variantb_' }}
          extra-args: ${{ (matrix.variant == github.event.inputs.variantA) &&  fromJson(github.event.inputs.extra_build_args).extraArgsVariantA || (matrix.variant == github.event.inputs.variantB) &&  fromJson(github.event.inputs.extra_build_args).extraArgsVariantB }}
          jdk_version: ${{ (matrix.variant == github.event.inputs.variantA) && fromJson(github.event.inputs.java_args).javaVersionVariantA || (matrix.variant == github.event.inputs.variantB) &&  fromJson(github.event.inputs.java_args).javaVersionVariantB }}
          jdk_vendor: ${{ (matrix.variant == github.event.inputs.variantA) && fromJson(github.event.inputs.java_args).javaVendorVariantA || (matrix.variant == github.event.inputs.variantB) &&  fromJson(github.event.inputs.java_args).javaVendorVariantB }}
          cache-url: ${{ secrets.CI_URL_CACHE_NODE }}
      - uses: actions/checkout@v4
    outputs:
      iterations: ${{ needs.iterations.outputs.iterations }}
      skip: ${{ github.event.inputs.mode == 'no caching' }}

  execution-caching:
    if: github.event.inputs.mode != 'no caching'
    needs: [seed]
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        variant: ["${{ github.event.inputs.variantA }}","${{ github.event.inputs.variantB }}"]
        runs: ${{ fromJson(needs.seed.outputs.iterations) }}
    steps:
      - uses: actions/checkout@v4
      - name: Conditionally wait for seed job
        if: ${{ github.event.inputs.mode != 'no caching' }}
        run: echo "Waiting for seed job to complete"
      - uses: ./.github/workflows/runner
        with:
          task: "${{ github.event.inputs.task }}"
          mode: "${{ github.event.inputs.mode }}"
          experiment-id: "no-profile-${{github.run_number}}"
          execution-number: ${{github.run_number}}
          variant: ${{ matrix.variant }}
          api-key: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
          cache-url: ${{ secrets.CI_URL_CACHE_NODE }}
          repository: ${{ github.event.inputs.repository }}
          variant-prefix: ${{ (matrix.variant == github.event.inputs.variantA) &&  'varianta_' || (matrix.variant == github.event.inputs.variantB) &&  'variantb_' }}
          extra-args: ${{ (matrix.variant == github.event.inputs.variantA) &&  fromJson(github.event.inputs.extra_build_args).extraArgsVariantA || (matrix.variant == github.event.inputs.variantB) &&  fromJson(github.event.inputs.extra_build_args).extraArgsVariantB }}
          jdk_version: ${{ (matrix.variant == github.event.inputs.variantA) && fromJson(github.event.inputs.java_args).javaVersionVariantA || (matrix.variant == github.event.inputs.variantB) &&  fromJson(github.event.inputs.java_args).javaVersionVariantB }}
          jdk_vendor: ${{ (matrix.variant == github.event.inputs.variantA) && fromJson(github.event.inputs.java_args).javaVendorVariantA || (matrix.variant == github.event.inputs.variantB) &&  fromJson(github.event.inputs.java_args).javaVendorVariantB }}
      - uses: actions/checkout@v4

  execution-no-caching:
    if: github.event.inputs.mode == 'no caching'
    needs: [iterations]
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        variant: ["${{ github.event.inputs.variantA }}","${{ github.event.inputs.variantB }}"]
        runs: ${{ fromJson(needs.iterations.outputs.iterations) }}
    steps:
      - uses: actions/checkout@v4
      - name: Conditionally wait for seed job
        if: ${{ github.event.inputs.mode != 'no caching' }}
        run: echo "Waiting for seed job to complete"
      - uses: ./.github/workflows/runner
        with:
          task: "${{ github.event.inputs.task }}"
          mode: "${{ github.event.inputs.mode }}"
          experiment-id: "no-profile-${{github.run_number}}"
          execution-number: ${{github.run_number}}
          variant: ${{ matrix.variant }}
          api-key: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
          repository: ${{ github.event.inputs.repository }}
          variant-prefix: ${{ (matrix.variant == github.event.inputs.variantA) &&  'varianta_' || (matrix.variant == github.event.inputs.variantB) &&  'variantb_' }}
          extra-args: ${{ (matrix.variant == github.event.inputs.variantA) &&  fromJson(github.event.inputs.extra_build_args).extraArgsVariantA || (matrix.variant == github.event.inputs.variantB) &&  fromJson(github.event.inputs.extra_build_args).extraArgsVariantB }}
          jdk_version: ${{ (matrix.variant == github.event.inputs.variantA) && fromJson(github.event.inputs.java_args).javaVersionVariantA || (matrix.variant == github.event.inputs.variantB) &&  fromJson(github.event.inputs.java_args).javaVersionVariantB }}
          jdk_vendor: ${{ (matrix.variant == github.event.inputs.variantA) && fromJson(github.event.inputs.java_args).javaVendorVariantA || (matrix.variant == github.event.inputs.variantB) &&  fromJson(github.event.inputs.java_args).javaVendorVariantB }}
      - uses: actions/checkout@v4

  report-no-caching:
    if: fromJson(github.event.inputs.extra_report_args).report_enabled == 'true'
    runs-on: "ubuntu-latest"
    needs: [execution-no-caching]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/report
        with:
          task: "${{ github.event.inputs.task }}"
          experiment-id: "no-profile-${{github.run_number}}"
          tags: "varianta_${{ github.event.inputs.variantA }},variantb_${{ github.event.inputs.variantB }}"
          api-key: ${{ secrets.GE_API_KEY }}
          url: ${{ secrets.GE_URL }}
          gh_token: ${{secrets.GITHUB_TOKEN}}
          profile: false
          taskpathreport: fromJson(github.event.inputs.extra_report_args).taskpath_report
          processreport: fromJson(github.event.inputs.extra_report_args).process_report
          kotlinreport:  fromJson(github.event.inputs.extra_report_args).kotlin_build_report
      - uses: actions/checkout@v4

  report:
    if: fromJson(github.event.inputs.extra_report_args).report_enabled == 'true'
    runs-on: "ubuntu-latest"
    needs: [execution-caching]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/workflows/report
        with:
          task: "${{ github.event.inputs.task }}"
          experiment-id: "no-profile-${{github.run_number}}"
          tags: "varianta_${{ github.event.inputs.variantA }},variantb_${{ github.event.inputs.variantB }}"
          api-key: ${{ secrets.GE_API_KEY }}
          url: ${{ secrets.GE_URL }}
          gh_token: ${{secrets.GITHUB_TOKEN}}
          profile: false
          taskpathreport: fromJson(github.event.inputs.extra_report_args).taskpath_report
          processreport: fromJson(github.event.inputs.extra_report_args).process_report
          kotlinreport:  fromJson(github.event.inputs.extra_report_args).kotlin_build_report
      - uses: actions/checkout@v4      