name: 'Experiment Report'
inputs:
  api-key:
    required: true
  url:
    required: true
  task:
    required: true
  max-builds:
    required: false
    default: 200
  experiment-id:
    required: true
  tags:
    required: true
  profile:
    required: true
  gh_token:
    required: true
  taskpathreport:
    required: true
  tasktypereport:
    required: true
  processreport:
    required: true
  kotlinreport:
    required: true
  resourceusagereport:
    required: true    
  onlycacheableoutcome:
    required: true    

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: 17
    - name: Execute CompareGEBuilds
      id : compareBuilds
      run: |
           curl -L https://github.com/cdsap/CompareGEBuilds/releases/download/v0.3.2/build-experiment-results --output build-experiment-results
           chmod 0757 build-experiment-results
           #process tags
           tags="${{ inputs.tags }}"
           arrayTags=(${tags//,/ })
           tagsParsed=""
           variants=""
           for val in "${arrayTags[@]}";
           do
              tagsParsed="$tagsParsed --variants=$val"
           done
           profile=""
           if [ "${{ inputs.profile }}" == "true" ]
           then
             profile="--profile"
           else
             profile=""
           fi
           
           taskpathreport=""
           if [ "${{ inputs.taskpathreport }}" == "false" ]
           then
             taskpathreport="--no-task-path-report"
           else
             taskpathreport="--task-path-report"
           fi
           tasktypereport=""
           if [ "${{ inputs.tasktypereport }}" == "false" ]
           then
             tasktypereport="--no-task-type-report"
           else
             tasktypereport="--task-type-report"
           fi
           processreport=""
           if [ "${{ inputs.processreport }}" == "false" ]
           then
             processreport="--no-process-report"
           else
             processreport="--process-report"  
           fi
           kotlinreport=""
           if [ "${{ inputs.kotlinreport }}" == "false" ]
           then
             kotlinreport="--no-kotlin-build-report"
           else
             kotlinreport="--kotlin-build-report"  
           fi
           resourceusagereport=""
           if [ "${{ inputs.resourceusagereport }}" == "false" ]
           then
             resourceusagereport="--no-resource-usage-report"
           else
             resourceusagereport="--resource-usage-report"  
           fi
           onlycacheableoutcome=""
           if [ "${{ inputs.onlycacheableoutcome }}" == "false" ]
           then
             onlycacheableoutcome="--no-only-cacheable-outcome"
            else
             onlycacheableoutcome="--only-cacheable-outcome"
           fi

           ./build-experiment-results --url=${{ inputs.url }} $taskpathreport $tasktypereport $processreport $kotlinreport $resourceusagereport $onlycacheableoutcome $profile --max-builds=${{ inputs.max-builds }}  $tagsParsed --experiment-id=${{ inputs.experiment-id }}  --api-key=${{ inputs.api-key }}
           CONTENT=$(cat results_experiment)
           echo "$CONTENT" >> $GITHUB_STEP_SUMMARY
      shell: bash
    - name: Archive production artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-comparison-reports
        path: |
          results_experiment
          build_comparison.csv
        if-no-files-found: error
