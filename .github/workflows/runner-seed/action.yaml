name: 'Experiment runner'
inputs:
  task:
    required: true
  variant:
    required: true
  variant-prefix:
    required: true
  experiment-id:
    required: true
  api-key:
    required: true
  repository:
    required: true
  run-id:
    required: true
  jdk_version:
    required: false
    default: 17
  jdk_vendor:
    required: false
    default: "zulu"
  mode:
    required: true
  extra-args:
    required: true  
  cache-url:
    required: false  
  cache-exclude-script:
    required: false         
  

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v4
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.variant }}
    - uses: actions/setup-java@v4
      with:
        distribution: ${{ inputs.jdk_vendor }}
        java-version: ${{ inputs.jdk_version }}
    - name: Set Gradle Cache Excludes
      id: set-cache-excludes
      run: |
          echo "${{ input.cache-exclude-script }}" > execute_task.sh
          chmod +x execute_task.sh
          ./execute_task.sh
      shell: bash    
    - name: Setup Gradle
      if: github.event.inputs.mode != 'no caching'     
      uses: gradle/actions/setup-gradle@v3
      with:
        cache-write-only: true
        cache-overwrite-existing: true
        add-job-summary: 'never'
        gradle-home-cache-excludes: ${{ env.GRADLE_HOME_CACHE_EXCLUDES}}
      env:
        GRADLE_BUILD_ACTION_CACHE_KEY_JOB_INSTANCE: ${{inputs.experiment-id}}-${{inputs.variant}}
    - name: Execute Gradle build
      id : gradle-build
      run: |
           ./gradlew ${{ inputs.task }} ${{ inputs.extra-args }} -Dscan.tag.seed_${{ inputs.variant-prefix }}${{ inputs.variant }} -Dscan.tag.seed-"${{ inputs.mode }}" -Dscan.tag.seed -Dscan.tag.seed_${{inputs.experiment-id}}
      shell: bash
      env:
        GRADLE_ENTERPRISE_ACCESS_KEY: ${{ inputs.api-key }}
        CI_URL_CACHE_NODE: ${{ inputs.cache-url }}
    - uses: actions/checkout@v4
            
