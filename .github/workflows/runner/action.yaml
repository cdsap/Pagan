name: 'Experiment runner'
inputs:
  task:
    required: true
  variant:
    required: true
  variant-prefix:
    required: true
  experiment-id:
    required: true
  api-key:
    required: true
  repository:
    required: true
  run-id:
    required: true
  jdk_version:
    required: false
    default: 17
  jdk_vendor:
    required: false
    default: "zulu"    
  execution-number:
    required: true 
  mode:
    required: true 
  extra-args:
    required: true  
  cache-url:
    required: false 
  cache-excludes:
    required: true    

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v4
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.variant }}
    - uses: actions/setup-java@v4
      with:
        distribution: ${{ inputs.jdk_vendor }}
        java-version: ${{ inputs.jdk_version }}
    - name: Setup Gradle
      if: github.event.inputs.mode != 'no caching'    
      uses: gradle/actions/setup-gradle@v3
      with:
        cache-read-only: true
        add-job-summary: 'never'
        gradle-home-cache-excludes: ${{ inputs.cache-excludes }}      
      env:
        GRADLE_BUILD_ACTION_CACHE_KEY_JOB: 'seed'
        GRADLE_BUILD_ACTION_CACHE_KEY_JOB_INSTANCE: ${{inputs.execution-number}}-${{inputs.variant}}

    - name: Execute Gradle build
      id : gradle-build
      run: |
           ./gradlew ${{ inputs.task }} ${{ inputs.extra-args }} -Dscan.tag.${{ inputs.run-id }} -Dscan.tag.${{ inputs.variant-prefix }}${{ inputs.variant }} -Dscan.tag."${{ inputs.mode }}" -Dscan.tag.experiment -Dscan.tag.${{inputs.experiment-id}}
      shell: bash
      env:
        DEVELOCITY_ACCESS_KEY: ${{ inputs.api-key }}
        GRADLE_BUILD_ACTION_CACHE_KEY_JOB: 'seed'
        CI_URL_CACHE_NODE: ${{ inputs.cache-url }}
